<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeLab Portal | datasharkvag.com</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4/dist/index.global.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Use specific version of lucide for stability -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>
    <!-- Mermaid JS for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; font-size: 17px; line-height: 1.55; }
        .font-mono { font-family: 'Fira Code', monospace; }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Smooth transitions for tab switching */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mermaid styling adjustment */
        .mermaid {
            display: flex;
            justify-content: center;
            /* "safe" keeps an over-wide diagram from being clipped on its left
               edge, where centred overflow is unreachable by scrolling. */
            justify-content: safe center;
            width: 100%;
        }
        
        /* Sizes to the diagram's natural height; scrolls only when a diagram is
           genuinely larger than the viewport. */
        .mermaid-container {
            overflow: auto;
            padding: 1.5rem;
            width: 100%;
            max-height: min(92vh, 1500px);
        }
        
        /* Render at natural size and let the container scroll. Clamping the SVG
           to 100% shrank wide diagrams until the label text was unreadable. */
        .mermaid svg {
            max-width: none !important;
            height: auto !important;
        }

        /* Contrast only. Do NOT set font-weight or font-size here: mermaid
           measures label text to size each node, so restyling afterwards makes
           the text wider than the box it was measured for. */
        .mermaid .nodeLabel,
        .mermaid .nodeLabel p,
        .mermaid .cluster-label,
        .mermaid .cluster-label p {
            color: #0f172a !important;
            line-height: 1.35;
        }

        /* Edge labels sit on top of the connector line; without an opaque
           backing the text is unreadable where they overlap. */
        .mermaid .edgeLabel {
            background-color: #ffffff !important;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .mermaid .edgeLabel,
        .mermaid .edgeLabel p {
            color: #0f172a !important;
            background-color: #ffffff !important;
        }

        .mermaid .cluster rect {
            fill: #f8fafc !important;
            stroke: #cbd5e1 !important;
        }

        /* Sensor node detail schematic: larger tap targets and readable flow */
        .sensor-schematic {
            min-height: 11rem;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Initialize Mermaid
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose',
            fontFamily: 'Inter',
            flowchart: {
                // false = render at natural size; the container scrolls instead
                // of the diagram being scaled down until text is illegible.
                useMaxWidth: false,
                htmlLabels: true,
                curve: 'basis',
                padding: 14,
                nodeSpacing: 45,
                rankSpacing: 50
            },
            themeVariables: {
                fontSize: '16px',
                fontFamily: 'Inter, sans-serif',
                primaryColor: '#e0e7ff',
                primaryTextColor: '#1e293b',
                primaryBorderColor: '#6366f1',
                lineColor: '#475569',
                secondaryColor: '#f1f5f9',
                tertiaryColor: '#ffffff',
                nodeTextColor: '#1e293b',
                mainBkgColor: '#ffffff',
                defaultLinkColor: '#475569'
            }
        });

        // Icon Component to handle Lucide Icons in React without a build step
        const Icon = ({ name, className }) => {
            // In the browser CDN version, icons are often at lucide.icons[name]
            // We use dangerouslySetInnerHTML because the library gives us SVG data
            // Alternatively, we let lucide.createIcons() handle it via data attributes
            
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [activeSection, setActiveSection] = useState('overview');

            // Re-run lucide.createIcons() whenever the active section changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
                if (window.mermaid) {
                    // Mermaid measures label text to size each node. Inter loads
                    // asynchronously via @import, so rendering before it arrives
                    // sizes every box to fallback-font metrics and the real text
                    // then overflows. Wait for the font, then render.
                    const render = () => window.mermaid.contentLoaded();
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(() => setTimeout(render, 50));
                    } else {
                        setTimeout(render, 150);
                    }
                }
            }, [activeSection]); // Add activeSection as dependency

            const navigation = [
                { id: 'overview', name: 'Architecture', icon: 'layout' },
                { id: 'docker', name: 'Docker Stack', icon: 'hard-drive' },
                { id: 'networking', name: 'Networking & SSL', icon: 'globe' },
                { id: 'tailscale', name: 'Tailscale & MagicDNS', icon: 'network' },
                { id: 'pihole', name: 'Pi-hole', icon: 'shield' },
                { id: 'sensornode', name: 'Sensor Node (Pi-hat)', icon: 'thermometer' },
                { id: 'commands', name: 'Linux Commands', icon: 'command' },
                { id: 'guides', name: 'Setup Guides', icon: 'book-open' },
            ];

            const sections = {
                overview: (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-bold text-slate-800">Homelab Architecture</h2>
                            <span className="px-4 py-1.5 bg-emerald-100 text-emerald-800 text-sm font-bold rounded-full">LIVE</span>
                        </div>

                        {/* Mermaid Diagram Container */}
                        <div className="bg-gradient-to-br from-slate-50 to-white rounded-xl border border-slate-200 shadow-sm mermaid-container">
                            <div className="mermaid">
{`flowchart TB
    PubUser["🌐 Public<br/>visitor"]
    PrivUser["📱 You<br/>any browser"]

    subgraph CFedge["☁️ Cloudflare Edge"]
        direction TB
        DNS["DNS + TLS"]
        Access["🔑 Access policy<br/>sign-in required"]
    end

    subgraph Pi4["🖥️ Pi 4B"]
        direction TB
        CFD["🔌 cloudflared<br/>outbound only"]
        NPM["⚙️ Nginx Proxy<br/>Manager"]
        Public["🌤️ Public apps<br/>Weather<br/>Hedging"]
        Private["🔒 Private apps<br/>Nextcloud<br/>Grafana<br/>Portainer"]
        Data[("💾 Data<br/>InfluxDB<br/>MariaDB")]
    end

    PubUser --> DNS
    PrivUser --> DNS
    DNS -->|open| CFD
    DNS --> Access
    Access ==>|gated| CFD

    CFD --> NPM
    NPM --> Public
    NPM --> Private
    Private --> Data

    classDef pub fill:#fef3c7,stroke:#f59e0b,stroke-width:2px,color:#000
    classDef vpn fill:#e0e7ff,stroke:#6366f1,stroke-width:2px,color:#000
    classDef router fill:#ede9fe,stroke:#7c3aed,stroke-width:3px,color:#000
    classDef private fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#000
    classDef data fill:#dcfce7,stroke:#16a34a,stroke-width:2px,color:#000

    class PubUser,DNS pub
    class PrivUser,Access vpn
    class CFD,NPM router
    class Public pub
    class Private private
    class Data data`}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="p-6 md:p-7 bg-amber-50 border border-amber-200 rounded-xl">
                                <h3 className="flex items-center text-base font-semibold text-amber-700 mb-3">
                                    <Icon name="globe" className="mr-2 w-5 h-5" /> Public Zone - Cloudflare Tunnel
                                </h3>
                                <p className="text-sm text-amber-600 mb-3">Open to the internet — no policy</p>
                                <ul className="text-base text-amber-900 space-y-2">
                                    <li>• weather.datasharkvag.com (Static)</li>
                                    <li>• hedging.datasharkvag.com (Static)</li>
                                </ul>
                            </div>
                            <div className="p-6 md:p-7 bg-blue-50 border border-blue-200 rounded-xl">
                                <h3 className="flex items-center text-base font-semibold text-blue-700 mb-3">
                                    <Icon name="lock" className="mr-2 w-5 h-5" /> Private Zone - Cloudflare Access
                                </h3>
                                <p className="text-sm text-blue-600 mb-3">Same tunnel, gated by an Access policy — allowlisted identities only</p>
                                <ul className="text-base text-blue-900 space-y-2">
                                    <li>• cloud.datasharkvag.com (Nextcloud web)</li>
                                    <li>• grafana.datasharkvag.com (dashboards)</li>
                                    <li>• portainer.datasharkvag.com (Docker UI)</li>
                                </ul>
                            </div>
                        </div>

                        <div className="p-5 md:p-6 bg-slate-50 border-l-4 border-slate-400 rounded-r-xl">
                            <h4 className="flex items-center text-base font-semibold text-slate-700 mb-2">
                                <Icon name="network" className="mr-2 w-5 h-5" /> Second plane — device connectivity
                            </h4>
                            <p className="text-base text-slate-600 leading-relaxed">
                                One rule decides which plane a service uses: <strong>browser traffic goes on the tunnel, everything else stays on Tailscale.</strong> Home Assistant, Samba, SSH, Pi-hole admin, and Nextcloud sync clients are non-browser or too privileged to publish, so they live on the device plane — see the <strong>Tailscale &amp; MagicDNS</strong> tab.
                            </p>
                        </div>
                    </div>  
                ),
                docker: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Deployment Stack</h2>
                        <p className="text-slate-600 text-base leading-relaxed">The entire stack is deployed using a single Docker Compose file for high availability.</p>
                        <div className="bg-slate-800 rounded-xl p-6 md:p-7 font-mono text-sm md:text-base text-emerald-300 overflow-x-auto border border-slate-700">
                            <pre>{`services:
  nginx: # SSL termination & Proxy
  cloudflared: # Tunnel — public + private hostnames
  home_assistant: # Home Automation (Host Mode)
  nextcloud: # Private Storage
  influxdb2: # Time Series Data
  grafana: # Visualization
  portainer: # Management UI
  samba: # Network File Sharing`}</pre>
                        </div>
                    </div>
                ),
                networking: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">SSL & Routing Logic</h2>

                        <div className="p-6 md:p-7 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl">
                            <h4 className="text-lg font-bold text-amber-800">Why a tunnel — CGNAT</h4>
                            <p className="text-base text-amber-700 mt-2 leading-relaxed">
                                The ISP puts this line behind <strong>CGNAT</strong> — one public IP shared across many customers, and the NAT belongs to them. Port forwarding is not misconfigured here, it is unavailable: no router setting can expose port 443, because the address the world sees is not ours to bind.
                            </p>
                            <p className="text-base text-amber-700 mt-3 leading-relaxed">
                                Cloudflare Tunnel reverses the direction. <span className="font-mono text-sm bg-white px-1.5 py-0.5 rounded">cloudflared</span> dials <strong>out</strong> to Cloudflare on port 7844 and holds the connection open; the edge sends inbound requests back down it. Nothing for CGNAT to block, and no listening port on the internet to attack.
                            </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="p-6 border rounded-xl bg-white shadow-sm">
                                <h4 className="font-bold text-slate-700 text-base">Public Flow</h4>
                                <p className="text-sm text-slate-500 mt-2 uppercase tracking-wide">{"Visitor -> CF DNS -> Tunnel -> NPM -> Static"}</p>
                            </div>
                            <div className="p-6 border rounded-xl bg-white shadow-sm">
                                <h4 className="font-bold text-slate-700 text-base">Private Flow</h4>
                                <p className="text-sm text-slate-500 mt-2 uppercase tracking-wide">{"You -> CF DNS -> Access -> Tunnel -> NPM -> App"}</p>
                            </div>
                        </div>

                        <div className="p-6 md:p-7 border-l-4 border-indigo-500 bg-indigo-50 rounded-r-xl">
                            <h4 className="text-lg font-bold text-indigo-800">TLS &amp; routing</h4>
                            <p className="text-base text-indigo-700 mt-2 leading-relaxed">
                                Cloudflare terminates TLS at the edge. Every hostname reaches the same connector and resolves to <span className="font-mono text-sm bg-white px-1.5 py-0.5 rounded">http://nginx:80</span>; NPM routes on host header. NPM keeps its DNS-01 wildcard cert for the origin hop, but the edge cert is what browsers see.
                            </p>
                        </div>

                        <div className="p-6 md:p-7 bg-rose-50 border-l-4 border-rose-500 rounded-r-xl">
                            <h4 className="font-bold text-rose-800 text-base mb-2">The tunnel is not access control</h4>
                            <p className="text-base text-rose-700 leading-relaxed">
                                A tunnel makes an app <em>reachable</em>, nothing more. Per Cloudflare's docs, a published hostname with no Access application is available to anyone on the internet — so the Access policy goes in <strong>before</strong> the hostname is routed. That gap is the entire reason for the public/private tier split. There is no separate "Zero Trust tunnel" product; Zero Trust is the dashboard, Access is what gates the request.
                            </p>
                        </div>

                        <p className="text-sm text-slate-500 leading-relaxed">
                            Full detail — terminology, CNAME targets, container trade-offs, migration order — in <span className="font-mono">TUNNEL-ARCHITECTURE.md</span>.
                        </p>
                    </div>
                ),
                tailscale: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Tailscale &amp; MagicDNS</h2>
                        <p className="text-slate-600 text-base leading-relaxed">
                            The <strong>applied AI lab</strong> — a Mac mini main server plus mini PCs, each running one part of the stack. Not a VPN in the usual sense: there is no concentrator. A coordination server hands out keys and names, then steps aside, and machines connect <strong>directly</strong>, encrypted end to end. Inference on one box, the vector store on another, a laptop anywhere addressing both by name.
                        </p>

                        <div className="bg-gradient-to-br from-slate-50 to-white rounded-xl border border-slate-200 shadow-sm mermaid-container">
                            <div className="mermaid">
{`flowchart LR
    Laptop["💻 Laptop"]
    Phone["📱 Phone"]

    Mac["🍎 macmini<br/>main server<br/>agent orchestrator"]
    Infer["🧠 infer-01<br/>mini PC<br/>Ollama :11434"]
    Data["🗄️ data-01<br/>mini PC<br/>Postgres :5432"]
    DNS["🛡️ pihole<br/>DNS :53"]

    Laptop <--> Mac
    Laptop <--> Infer
    Laptop <--> DNS
    Phone <--> Mac
    Mac <-->|inference| Infer
    Mac <-->|state| Data
    Infer <-->|retrieval| Data

    classDef dev fill:#e0e7ff,stroke:#6366f1,stroke-width:2px,color:#000
    classDef main fill:#ede9fe,stroke:#7c3aed,stroke-width:3px,color:#000
    classDef ai fill:#dcfce7,stroke:#16a34a,stroke-width:2px,color:#000
    classDef node fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#000
    class Phone,Laptop dev
    class Mac main
    class Infer,Data ai
    class DNS node`}
                            </div>
                        </div>

                        <div className="p-6 md:p-7 bg-white border border-slate-200 rounded-xl shadow-sm">
                            <h4 className="font-bold text-slate-700 text-base mb-3">What runs where</h4>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-slate-500 uppercase text-xs tracking-wide border-b border-slate-200">
                                        <tr><th className="py-2 pr-4">Node</th><th className="py-2 pr-4">Runs</th><th className="py-2">Reached at</th></tr>
                                    </thead>
                                    <tbody className="text-slate-600">
                                        <tr className="border-b border-slate-100"><td className="py-2.5 pr-4 font-semibold">macmini</td><td className="py-2.5 pr-4">Main server — agent orchestrator</td><td className="py-2.5 font-mono text-xs">macmini.tailnet.ts.net</td></tr>
                                        <tr className="border-b border-slate-100"><td className="py-2.5 pr-4 font-semibold">infer-01</td><td className="py-2.5 pr-4">Ollama — local inference</td><td className="py-2.5 font-mono text-xs">infer-01.tailnet.ts.net:11434</td></tr>
                                        <tr className="border-b border-slate-100"><td className="py-2.5 pr-4 font-semibold">data-01</td><td className="py-2.5 pr-4">Postgres + pgvector</td><td className="py-2.5 font-mono text-xs">data-01.tailnet.ts.net:5432</td></tr>
                                        <tr><td className="py-2.5 pr-4 font-semibold">pihole</td><td className="py-2.5 pr-4">DNS + admin UI</td><td className="py-2.5 font-mono text-xs">pihole.tailnet.ts.net</td></tr>
                                    </tbody>
                                </table>
                            </div>
                            <p className="text-base text-slate-600 mt-4 leading-relaxed">
                                Also carries what the tunnel cannot: Samba, SSH, Home Assistant, and break-glass access for when Cloudflare is down. Those belong to the Raspberry Pi homelab — a separate project sharing the same tailnet.
                            </p>
                        </div>

                        <div className="p-6 md:p-7 border-l-4 border-indigo-500 bg-indigo-50 rounded-r-xl">
                            <h4 className="text-lg font-bold text-indigo-800">MagicDNS</h4>
                            <p className="text-base text-indigo-700 mt-2 leading-relaxed">
                                Every node gets a stable <span className="font-mono text-sm">100.x.y.z</span> address on join — reliable, unmemorable. MagicDNS is the tailnet's own DNS server mapping each node's name to it, updating itself when addresses change. Names resolve from any tailnet device on any network, and exist nowhere on public DNS.
                            </p>
                            <p className="text-base text-indigo-700 mt-3 leading-relaxed">
                                The nameserver field holds Pi-hole's <strong>Tailscale</strong> address, not its LAN one — <span className="font-mono text-sm">192.168.x.x</span> is unreachable the moment you leave the house.
                            </p>
                        </div>

                        <div className="p-6 md:p-7 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-xl">
                            <h4 className="font-bold text-emerald-800 text-base mb-2 flex items-center">
                                <Icon name="check-circle" className="mr-2 w-5 h-5" /> Override local DNS: OFF
                            </h4>
                            <p className="text-base text-emerald-700 leading-relaxed">
                                Devices keep their own resolver and use the tailnet's only when needed. Captive portals work, and phones on cellular are not forced through the Pi Zero.
                            </p>
                            <p className="text-base text-emerald-700 mt-3 leading-relaxed">
                                <strong>The trade:</strong> Pi-hole then filters only at home. Off-LAN you use the local network's resolver — no ad-blocking, and any custom names in Pi-hole stop resolving. Split DNS routes chosen domains to Pi-hole without forcing all queries through it, if that matters later.
                            </p>
                        </div>

                        <div className="p-6 md:p-7 bg-rose-50 border-l-4 border-rose-500 rounded-r-xl">
                            <h4 className="font-bold text-rose-800 text-base mb-2 flex items-center">
                                <Icon name="shield" className="mr-2 w-5 h-5" /> Bind to the tailnet address
                            </h4>
                            <p className="text-base text-rose-700 leading-relaxed">
                                Ollama and Postgres ship with <strong>no authentication</strong> — the network is the access control. Bound to <span className="font-mono text-sm">0.0.0.0</span> instead of the tailnet interface, an open model endpoint and an unauthenticated database are exposed to every machine on whatever LAN the box sits on.
                            </p>
                        </div>

                        <p className="text-sm text-slate-500 leading-relaxed">
                            Full detail — ACL tags, Tailscale SSH, key expiry, setup and verification commands — in <span className="font-mono">TAILSCALE-ARCHITECTURE.md</span>.
                        </p>
                    </div>
                ),
                pihole: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Pi-hole (Home Ad-Blocking)</h2>
                        <p className="text-slate-600 text-base leading-relaxed">
                            Pi-hole runs on a dedicated Pi Zero and blocks ads for everything on the home network. It is kept simple: <strong>LAN-only</strong>. Because Tailscale's "Override local DNS" is off, roaming devices use their own DNS — Pi-hole is not forced onto phones on cellular.
                        </p>

                        <div className="grid gap-8">
                            {/* Local Config */}
                            <div className="p-7 md:p-8 bg-amber-50 border border-amber-200 rounded-xl">
                                <p className="text-amber-800 font-bold text-base flex items-center mb-3">
                                    <Icon name="home" className="mr-2 w-5 h-5" /> How it blocks ads at home
                                </p>
                                <ul className="list-disc ml-6 text-sm text-amber-900 space-y-2 leading-relaxed">
                                    <li>Pi-hole runs on a dedicated Pi Zero with a static IP.</li>
                                    <li>Router DHCP hands out the Pi Zero IP as the DNS server.</li>
                                    <li>Every device on the home Wi-Fi/LAN is filtered automatically — no per-device setup.</li>
                                </ul>
                            </div>

                            {/* Remote access */}
                            <div className="p-7 md:p-8 bg-indigo-50 border border-indigo-200 rounded-xl">
                                <p className="text-indigo-800 font-bold text-base flex items-center mb-3">
                                    <Icon name="settings" className="mr-2 w-5 h-5" /> Manage it remotely
                                </p>
                                <p className="text-base text-indigo-700 mb-3 leading-relaxed">
                                    Add the Pi Zero to your tailnet so you can open the admin dashboard from anywhere over Tailscale.
                                </p>
                                <ul className="list-disc ml-6 text-sm text-indigo-900 space-y-2 leading-relaxed">
                                    <li>Install Tailscale on the Pi Zero (same account as the rest).</li>
                                    <li>Reach the dashboard at <span className="font-mono bg-white px-1.5 py-0.5 rounded text-xs">http://pihole.your-tailnet.ts.net/admin</span> via MagicDNS.</li>
                                    <li>No global nameserver, no "Override local DNS", no "Permit all origins" needed — the setup stays minimal.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                ),
                sensornode: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Sensor Node Architecture</h2>
                        <div className="bg-white p-7 md:p-8 rounded-xl border border-slate-200 shadow-sm">
                            <h3 className="text-base font-bold text-purple-600 mb-5 flex items-center uppercase tracking-wider">
                                <Icon name="activity" className="mr-2 w-5 h-5" /> Environmental Monitoring
                            </h3>
                            <div className="space-y-5">
                                <p className="text-base text-slate-600 leading-relaxed">
                                    A separate Raspberry Pi (Sensor Node) equipped with a Sense HAT collects environmental data and pushes it to the central InfluxDB database on the Main Server. Grafana then visualizes this data.
                                </p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 mt-5 items-stretch sensor-schematic">
                                    <div className="p-6 md:p-8 bg-purple-50 rounded-xl border border-purple-100 text-center flex flex-col justify-center min-h-[12rem]">
                                        <Icon name="thermometer" className="mx-auto text-purple-500 mb-4 w-9 h-9" />
                                        <p className="text-base font-bold text-purple-900">Source</p>
                                        <p className="text-sm text-purple-700 mt-2">Pi + Sense HAT</p>

                                    </div>

                            </h3>
                            <div className="font-mono text-sm overflow-x-auto leading-relaxed">
<pre>{`from sense_hat import SenseHat
from influxdb_client import InfluxDBClient, Point
from influxdb_client.client.write_api import SYNCHRONOUS
import time

# Configuration
INFLUX_URL = "http://192.168.1.50:8086" # IP of Main Server
INFLUX_TOKEN = "your-super-secret-auth-token"
INFLUX_ORG = "myorg"
INFLUX_BUCKET = "mybucket"

sense = SenseHat()
client = InfluxDBClient(url=INFLUX_URL, token=INFLUX_TOKEN, org=INFLUX_ORG)
write_api = client.write_api(write_options=SYNCHRONOUS)

while True:
    temp = sense.get_temperature()
    pressure = sense.get_pressure()
    humidity = sense.get_humidity()
    
    point = Point("environment") \\
        .field("temperature", temp) \\
        .field("pressure", pressure) \\
        .field("humidity", humidity)
        
    write_api.write(bucket=INFLUX_BUCKET, org=INFLUX_ORG, record=point)
    time.sleep(60) # Send every minute`}</pre>

                        </div>

                                </div>

                                    <code className="block bg-slate-100 p-3 rounded-lg text-sm font-mono mb-2 text-slate-600">pihole -g # Update Gravity</code>
                                    <code className="block bg-slate-100 p-3 rounded-lg text-sm font-mono text-slate-600">pihole -up # Update System</code>
                                </div>
                            </div>
                        </div>

                        {/* Troubleshooting Commands */}
                        <div className="bg-white p-7 md:p-8 rounded-xl border border-slate-200 shadow-sm">
                            <h3 className="text-base font-bold text-rose-600 mb-5 flex items-center uppercase tracking-wider">
                                <Icon name="terminal" className="mr-2 w-5 h-5" /> Troubleshooting
                            </h3>
                            <div className="space-y-5">
                                <div>
                                    <p className="text-sm font-semibold text-slate-700 mb-2">Search Text (Grep)</p>
                                    <code className="block bg-slate-100 p-3 rounded-lg text-sm font-mono">grep -r "error" /path/to/folder</code>
                                </div>
                                <div>
                                    <p className="text-sm font-semibold text-slate-700 mb-2">Disk & Ports</p>
                                    <code className="block bg-slate-100 p-3 rounded-lg text-sm font-mono mb-2 text-slate-600">df -h # Disk Space</code>
                                    <code className="block bg-slate-100 p-3 rounded-lg text-sm font-mono text-slate-600">sudo netstat -tulpn # Active Ports</code>
                                </div>
                            </div>
                        </div>
                    </div>
                ),
                guides: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Quick-Start Commands</h2>
                        <div className="bg-white p-7 md:p-8 rounded-xl border border-slate-200 shadow-sm">
                            <h3 className="text-base font-bold text-slate-800 mb-5 flex items-center uppercase tracking-wider">
                                <Icon name="book-open" className="mr-2 w-5 h-5" /> Standard Setup
                            </h3>
                            <div className="space-y-5">
                                <div className="p-5 bg-slate-50 rounded-xl border border-slate-100">
                                    <code className="text-sm font-bold text-pink-600">docker compose up -d</code>
                                    <p className="text-sm text-slate-600 mt-2 uppercase font-semibold tracking-wide">Deploy main stack in background</p>
                                </div>

                        </div>

            return (

                        </div>
                        
                        <div className="space-y-1 flex-grow">

                            © 2025 datasharkvag.com | Pi 4B Architecture (8GB RAM)
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
