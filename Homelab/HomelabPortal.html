    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; font-size: 17px; line-height: 1.55; }
        .font-mono { font-family: 'Fira Code', monospace; }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Smooth transitions for tab switching */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mermaid styling adjustment */
        .mermaid { 
            display: flex; 
            justify-content: center;
            width: 100%;
        }
        
        .mermaid-container {
            overflow-x: auto;
            overflow-y: auto;
            padding: 1.75rem 2rem;
            width: 100%;
            min-height: min(72vh, 920px);
            max-height: min(88vh, 1000px);
        }
        
        .mermaid svg {
            max-width: 100% !important;
            height: auto !important;
        }

        /* Sensor node detail schematic: larger tap targets and readable flow */
        .sensor-schematic {
            min-height: 11rem;
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Initialize Mermaid
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose',
            fontFamily: 'Inter',
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true,
                curve: 'basis',
                padding: 32,
                nodeSpacing: 120,
                rankSpacing: 150
            },
            themeVariables: {
                fontSize: '24px',
                fontFamily: 'Inter, sans-serif',
                primaryColor: '#e0e7ff',
                primaryTextColor: '#1e293b',
                primaryBorderColor: '#6366f1',
                lineColor: '#475569',
                secondaryColor: '#f1f5f9',
                tertiaryColor: '#ffffff',
                nodeTextColor: '#1e293b',
                mainBkgColor: '#ffffff',
                defaultLinkColor: '#475569'
            }

        // Icon Component to handle Lucide Icons in React without a build step
        const Icon = ({ name, className }) => {
            // In the browser CDN version, icons are often at lucide.icons[name]
            // We use dangerouslySetInnerHTML because the library gives us SVG data
            // Alternatively, we let lucide.createIcons() handle it via data attributes
            
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [activeSection, setActiveSection] = useState('overview');

            // Re-run lucide.createIcons() whenever the active section changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
                if (window.mermaid) {
                    // Slight delay to ensure DOM is ready for mermaid
                    setTimeout(() => {
                        window.mermaid.contentLoaded();
                    }, 100);
                }
            }, [activeSection]); // Add activeSection as dependency

            const navigation = [
                { id: 'overview', name: 'Architecture', icon: 'layout' },
                { id: 'docker', name: 'Docker Stack', icon: 'hard-drive' },
                { id: 'networking', name: 'Networking & SSL', icon: 'globe' },
                { id: 'tailscale', name: 'Tailscale & MagicDNS', icon: 'network' },
                { id: 'pihole', name: 'Pi-hole', icon: 'shield' },
                { id: 'sensornode', name: 'Sensor Node (Pi-hat)', icon: 'thermometer' },

{`flowchart TB
    PubUser["🌐 Public Visitor"]
    PrivUser["📱 You — on Tailscale"]

    CF["☁️ Cloudflare Tunnel"]
    TS["🔐 Tailscale + MagicDNS<br/>(peer-to-peer)"]

    subgraph Pi4["🖥️ Main Server — Pi 4B"]
        direction TB
        NPM["⚙️ Nginx Proxy Manager<br/>SSL + routing"]
        Public["🌤️ Public Apps<br/>Weather · Hedging"]
        Private["🔒 Private Apps<br/>Nextcloud · Grafana · Home Assistant · Portainer"]

        PiHole["🛡️ Pi-hole — Pi Zero<br/>LAN ad-blocking"]

    %% Public path
    PubUser -->|HTTPS| CF
    CF --> NPM
    NPM --> Public

    %% Private path
    PrivUser -->|encrypted peer link| TS
    TS --> NPM
    NPM --> Private
    Private --> Data

    %% Sensor writes metrics
    Sensor -->|writes metrics| Data

    %% Styling
    classDef pub fill:#fef3c7,stroke:#f59e0b,stroke-width:2px,color:#000
    classDef vpn fill:#e0e7ff,stroke:#6366f1,stroke-width:2px,color:#000

    class NPM router
    class Public pub
    class Private private
    class Data data
    class PiHole,Sensor remote`}
                            </div>

<pre>{`from sense_hat import SenseHat
from influxdb_client import InfluxDBClient, Point
from influxdb_client.client.write_api import SYNCHRONOUS
import time

# Configuration
INFLUX_URL = "http://192.168.1.50:8086" # IP of Main Server
INFLUX_TOKEN = "your-super-secret-auth-token"
INFLUX_ORG = "myorg"
INFLUX_BUCKET = "mybucket"

sense = SenseHat()
client = InfluxDBClient(url=INFLUX_URL, token=INFLUX_TOKEN, org=INFLUX_ORG)
write_api = client.write_api(write_options=SYNCHRONOUS)

while True:
    temp = sense.get_temperature()
    pressure = sense.get_pressure()
    humidity = sense.get_humidity()
    
    point = Point("environment") \\
        .field("temperature", temp) \\
        .field("pressure", pressure) \\
        .field("humidity", humidity)
        
    write_api.write(bucket=INFLUX_BUCKET, org=INFLUX_ORG, record=point)
    time.sleep(60) # Send every minute`}</pre>

                                </div>
                                <div className="p-5 bg-slate-50 rounded-xl border border-slate-100">
                                    <code className="text-sm font-bold text-pink-600">sudo reboot</code>
                                    <p className="text-sm text-slate-600 mt-2 uppercase font-semibold tracking-wide">Restart system safely</p>
                                </div>
                            </div>
                        </div>
                    </div>
                )
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
                    {/* Sidebar */}
                    <nav className="w-full md:w-64 bg-slate-900 text-white p-7 flex-shrink-0 flex flex-col">
                        <div className="flex items-center space-x-2 mb-10">
                            <Icon name="activity" className="text-emerald-400 w-8 h-8" />
                            <h1 className="text-xl font-bold tracking-tight">Portal</h1>
                        </div>
                        
                        <div className="space-y-1 flex-grow">
                            {navigation.map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveSection(item.id)}
                                    className={`w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl transition-all ${
                                        activeSection === item.id 
                                        ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-900/40' 
                                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                                    }`}
                                >
                                    <Icon name={item.icon} className="w-5 h-5" />
                                    <span className="font-medium text-base">{item.name}</span>
                                </button>
                            ))}
                        </div>

                        <div className="mt-8 pt-6 border-t border-slate-800">
                            <div className="p-4 bg-slate-800 rounded-xl">
                                <p className="text-xs text-slate-500 uppercase font-bold tracking-tighter mb-1.5">Active Root</p>
                                <p className="text-sm font-mono text-emerald-400">datasharkvag.com</p>
                            </div>
                        </div>
                    </nav>

                    {/* Content Area - Uses key to force re-render on section change to prevent DOM mismatch */}
                    <main className="flex-1 p-5 md:p-10 lg:p-12 overflow-y-auto">
                        <div 
                            key={activeSection}
                            className={`mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 min-h-[500px] fade-in ${
                                activeSection === 'overview'
                                    ? 'max-w-7xl w-full p-7 md:p-10 lg:p-12'
                                    : 'max-w-4xl p-7 md:p-11 lg:p-12'
                            }`}
                        >
                            {sections[activeSection]}
                        </div>
                        <footer className="mt-10 text-center text-slate-400 text-xs uppercase tracking-widest">
                            © 2025 datasharkvag.com | Pi 4B Architecture (8GB RAM)
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
