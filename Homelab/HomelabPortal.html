<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeLab Portal | datasharkvag.com</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4/dist/index.global.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Use specific version of lucide for stability -->
    <script src="https://unpkg.com/lucide@0.263.1"></script>
    <!-- Mermaid JS for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; font-size: 17px; line-height: 1.55; }
        .font-mono { font-family: 'Fira Code', monospace; }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Smooth transitions for tab switching */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mermaid styling adjustment */
        .mermaid {
            display: flex;
            justify-content: center;
            /* "safe" keeps an over-wide diagram from being clipped on its left
               edge, where centred overflow is unreachable by scrolling. */
            justify-content: safe center;
            width: 100%;
        }
        
        /* Sizes to the diagram's natural height; scrolls only when a diagram is
           genuinely larger than the viewport. */
        .mermaid-container {
            overflow: auto;
            padding: 1.5rem;
            width: 100%;
            max-height: min(92vh, 1500px);
        }
        
        /* Render at natural size and let the container scroll. Clamping the SVG
           to 100% shrank wide diagrams until the label text was unreadable. */
        .mermaid svg {
            max-width: none !important;
            height: auto !important;
        }

        /* Contrast only. Do NOT set font-weight or font-size here: mermaid
           measures label text to size each node, so restyling afterwards makes
           the text wider than the box it was measured for. */
        .mermaid .nodeLabel,
        .mermaid .nodeLabel p,
        .mermaid .cluster-label,
        .mermaid .cluster-label p {
            color: #0f172a !important;
            line-height: 1.35;
        }

        /* Edge labels sit on top of the connector line; without an opaque
           backing the text is unreadable where they overlap. */
        .mermaid .edgeLabel {
            background-color: #ffffff !important;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .mermaid .edgeLabel,
        .mermaid .edgeLabel p {
            color: #0f172a !important;
            background-color: #ffffff !important;
        }

        .mermaid .cluster rect {
            fill: #f8fafc !important;
            stroke: #cbd5e1 !important;
        }

        /* Sensor node detail schematic: larger tap targets and readable flow */
        .sensor-schematic {
            min-height: 11rem;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Initialize Mermaid
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose',
            fontFamily: 'Inter',
            flowchart: {
                // false = render at natural size; the container scrolls instead
                // of the diagram being scaled down until text is illegible.
                useMaxWidth: false,
                htmlLabels: true,
                curve: 'basis',
                padding: 14,
                nodeSpacing: 45,
                rankSpacing: 50
            },
            themeVariables: {
                fontSize: '16px',
                fontFamily: 'Inter, sans-serif',
                primaryColor: '#e0e7ff',
                primaryTextColor: '#1e293b',
                primaryBorderColor: '#6366f1',
                lineColor: '#475569',
                secondaryColor: '#f1f5f9',
                tertiaryColor: '#ffffff',
                nodeTextColor: '#1e293b',
                mainBkgColor: '#ffffff',
                defaultLinkColor: '#475569'
            }
        });

        // Icon Component to handle Lucide Icons in React without a build step
        const Icon = ({ name, className }) => {
            // In the browser CDN version, icons are often at lucide.icons[name]
            // We use dangerouslySetInnerHTML because the library gives us SVG data
            // Alternatively, we let lucide.createIcons() handle it via data attributes
            
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [activeSection, setActiveSection] = useState('overview');

            // Re-run lucide.createIcons() whenever the active section changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
                if (window.mermaid) {
                    // Mermaid measures label text to size each node. Inter loads
                    // asynchronously via @import, so rendering before it arrives
                    // sizes every box to fallback-font metrics and the real text
                    // then overflows. Wait for the font, then render.
                    const render = () => window.mermaid.contentLoaded();
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(() => setTimeout(render, 50));
                    } else {
                        setTimeout(render, 150);
                    }
                }
            }, [activeSection]); // Add activeSection as dependency

            const navigation = [
                { id: 'overview', name: 'Architecture', icon: 'layout' },
                { id: 'docker', name: 'Docker Stack', icon: 'hard-drive' },
                { id: 'networking', name: 'Networking & SSL', icon: 'globe' },
                { id: 'tailscale', name: 'Tailscale & MagicDNS', icon: 'network' },
                { id: 'pihole', name: 'Pi-hole', icon: 'shield' },
                { id: 'sensornode', name: 'Sensor Node (Pi-hat)', icon: 'thermometer' },
                { id: 'commands', name: 'Linux Commands', icon: 'command' },
                { id: 'guides', name: 'Setup Guides', icon: 'book-open' },
            ];

            const sections = {
                overview: (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-bold text-slate-800">Homelab Architecture</h2>
                            <span className="px-4 py-1.5 bg-emerald-100 text-emerald-800 text-sm font-bold rounded-full">LIVE</span>
                        </div>

                        {/* Mermaid Diagram Container */}
                        <div className="bg-gradient-to-br from-slate-50 to-white rounded-xl border border-slate-200 shadow-sm mermaid-container">
                            <div className="mermaid">
{`flowchart TB
    PubUser["🌐 Public<br/>visitor"]
    PrivUser["📱 You<br/>any browser"]

    subgraph CFedge["☁️ Cloudflare Edge"]
        direction TB
        DNS["DNS + TLS"]
        Access["🔑 Access policy<br/>sign-in required"]
    end

    subgraph Pi4["🖥️ Pi 4B"]
        direction TB
        CFD["🔌 cloudflared<br/>outbound only"]
        NPM["⚙️ Nginx Proxy<br/>Manager"]
        Public["🌤️ Public apps<br/>Weather<br/>Hedging"]
        Private["🔒 Private apps<br/>Nextcloud<br/>Grafana<br/>Portainer"]
        Data[("💾 Data<br/>InfluxDB<br/>MariaDB")]
    end

    PubUser --> DNS
    PrivUser --> DNS
    DNS -->|open| CFD
    DNS --> Access
    Access ==>|gated| CFD

    CFD --> NPM
    NPM --> Public
    NPM --> Private
    Private --> Data

    classDef pub fill:#fef3c7,stroke:#f59e0b,stroke-width:2px,color:#000
    classDef vpn fill:#e0e7ff,stroke:#6366f1,stroke-width:2px,color:#000
    classDef router fill:#ede9fe,stroke:#7c3aed,stroke-width:3px,color:#000
    classDef private fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#000
    classDef data fill:#dcfce7,stroke:#16a34a,stroke-width:2px,color:#000

    class PubUser,DNS pub
    class PrivUser,Access vpn
    class CFD,NPM router
    class Public pub
    class Private private
    class Data data`}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="p-6 md:p-7 bg-amber-50 border border-amber-200 rounded-xl">
                                <h3 className="flex items-center text-base font-semibold text-amber-700 mb-3">
                                    <Icon name="globe" className="mr-2 w-5 h-5" /> Public Zone - Cloudflare Tunnel
                                </h3>
                                <p className="text-sm text-amber-600 mb-3">Open to the internet — no policy</p>
                                <ul className="text-base text-amber-900 space-y-2">
                                    <li>• weather.datasharkvag.com (Static)</li>
                                    <li>• hedging.datasharkvag.com (Static)</li>
                                </ul>
                            </div>
                            <div className="p-6 md:p-7 bg-blue-50 border border-blue-200 rounded-xl">
                                <h3 className="flex items-center text-base font-semibold text-blue-700 mb-3">
                                    <Icon name="lock" className="mr-2 w-5 h-5" /> Private Zone - Cloudflare Access
                                </h3>
                                <p className="text-sm text-blue-600 mb-3">Same tunnel, gated by an Access policy — allowlisted identities only</p>
                                <ul className="text-base text-blue-900 space-y-2">
                                    <li>• cloud.datasharkvag.com (Nextcloud web)</li>
                                    <li>• grafana.datasharkvag.com (dashboards)</li>
                                    <li>• portainer.datasharkvag.com (Docker UI)</li>
                                </ul>
                            </div>
                        </div>

                        <div className="p-5 md:p-6 bg-slate-50 border-l-4 border-slate-400 rounded-r-xl">
                            <h4 className="flex items-center text-base font-semibold text-slate-700 mb-2">
                                <Icon name="network" className="mr-2 w-5 h-5" /> Second plane — device connectivity
                            </h4>
                            <p className="text-base text-slate-600 leading-relaxed">
                                One rule decides which plane a service uses: <strong>browser traffic goes on the tunnel, everything else stays on Tailscale.</strong> Home Assistant, Samba, SSH, Pi-hole admin, and Nextcloud sync clients are non-browser or too privileged to publish, so they live on the device plane — see the <strong>Tailscale &amp; MagicDNS</strong> tab.
                            </p>
                        </div>
                    </div>  
                ),
                docker: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Deployment Stack</h2>
                        <p className="text-slate-600 text-base leading-relaxed">The entire stack is deployed using a single Docker Compose file for high availability.</p>
                        <div className="bg-slate-800 rounded-xl p-6 md:p-7 font-mono text-sm md:text-base text-emerald-300 overflow-x-auto border border-slate-700">
                            <pre>{`services:
  nginx: # SSL termination & Proxy
  cloudflared: # Tunnel — public + private hostnames
  home_assistant: # Home Automation (Host Mode)
  nextcloud: # Private Storage
  influxdb2: # Time Series Data
  grafana: # Visualization
  portainer: # Management UI
  samba: # Network File Sharing`}</pre>
                        </div>
                    </div>
                ),
                networking: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">SSL & Routing Logic</h2>

                        <div className="p-6 md:p-7 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl">
                            <h4 className="text-lg font-bold text-amber-800">Why a tunnel — CGNAT</h4>
                            <blockquote className="mt-3 mb-1 pl-4 border-l-2 border-amber-400 text-base text-amber-800 italic leading-relaxed">
                                "Create secure, outbound-only connections from your infrastructure to Cloudflare without opening inbound ports."
                                <span className="block not-italic text-sm text-amber-600 mt-1">— Cloudflare Zero Trust dashboard, Networks → Tunnels</span>
                            </blockquote>
                            <p className="text-base text-amber-700 mt-3 leading-relaxed">
                                Note what that promises and what it does not. It covers <em>reachability</em> — outbound-only, no inbound ports. It says nothing about who may reach the app once the hostname is live. That gap is the whole reason for the public/private tier split.
                            </p>
                            <p className="text-base text-amber-700 mt-2 leading-relaxed">
                                The ISP puts this line behind <strong>CGNAT</strong>: one public IP shared across many customers, and the NAT belongs to them. Port forwarding is not misconfigured here — it is unavailable. No router setting can expose port 443, because the address the world sees is not ours to bind.
                            </p>
                            <p className="text-base text-amber-700 mt-3 leading-relaxed">
                                Cloudflare Tunnel reverses the direction. <span className="font-mono text-sm bg-white px-1.5 py-0.5 rounded">cloudflared</span> makes an <strong>outbound-only</strong> connection to Cloudflare's edge on <strong>port 7844</strong> (UDP for QUIC, TCP for HTTP/2) and holds it open; the edge multiplexes inbound requests back down it. No inbound ports, no firewall changes, no public IP — and nothing for CGNAT to block, since it looks like ordinary outbound traffic. Same reason the origin has no attack surface: there is no listening port on the internet to find.
                            </p>
                        </div>

                        <div className="p-6 md:p-7 bg-white border border-slate-200 rounded-xl shadow-sm">
                            <h4 className="font-bold text-slate-700 text-base mb-3">As built</h4>
                            <ul className="text-base text-slate-600 space-y-2.5 leading-relaxed">
                                <li>• <strong>datasharkvag.com is on Cloudflare</strong> — not optional. <span className="font-mono text-sm">cfargotunnel.com</span> only proxies traffic for DNS records in the same Cloudflare account, so a tunnel cannot route a hostname on a domain hosted elsewhere. It is also what makes the DNS-01 wildcard cert possible.</li>
                                <li>• <strong>Each public hostname is a CNAME</strong> to <span className="font-mono text-sm">&lt;tunnel-UUID&gt;.cfargotunnel.com</span>. The record can exist before the tunnel runs — traffic just is not proxied until the connector is up.</li>
                                <li>• <strong>The connector runs in Docker</strong>, not as a host service: the <span className="font-mono text-sm">cloudflared</span> container on <span className="font-mono text-sm">homelab_net</span>, dashboard-managed via <span className="font-mono text-sm">--token</span>.</li>
                                <li>• <strong>Origins are Docker service names</strong> — <span className="font-mono text-sm">http://nginx:80</span>, never <span className="font-mono text-sm">localhost</span>, which inside the connector container means the connector itself.</li>
                            </ul>
                            <p className="text-base text-slate-600 mt-4 leading-relaxed">
                                Two consequences of running it containerised: updates arrive via <span className="font-mono text-sm">docker compose pull</span> rather than <span className="font-mono text-sm">apt</span>, and <span className="font-mono text-sm">restart: unless-stopped</span> is what does the reconnect work — if that container is down, every public hostname 502s at the edge.
                            </p>
                        </div>

                        <div className="p-6 md:p-7 bg-white border border-slate-200 rounded-xl shadow-sm">
                            <h4 className="font-bold text-slate-700 text-base mb-3">Terminology — what this actually is</h4>
                            <ul className="text-base text-slate-600 space-y-2 leading-relaxed">
                                <li>• <strong>Cloudflare Tunnel</strong> — the product. Formerly <strong>Argo Tunnel</strong>, renamed April 2021 when it stopped requiring an Argo subscription and became free.</li>
                                <li>• <strong>cloudflared</strong> — the connector daemon that dials out.</li>
                                <li>• <strong>Cloudflare One / Zero Trust</strong> — the dashboard and platform brand it is administered under. Not a tunnel type.</li>
                                <li>• <strong>Cloudflare Access</strong> — a <em>separate</em> product adding identity policies in front of an app.</li>
                            </ul>
                            <p className="text-base text-slate-600 mt-4 leading-relaxed">
                                So there is no such thing as a "Zero Trust tunnel". This is a Cloudflare Tunnel, specifically a <strong>remotely-managed</strong> one — created in the dashboard and run with <span className="font-mono text-sm bg-slate-100 px-1.5 py-0.5 rounded">--token</span>, rather than a locally-managed tunnel driven by a <span className="font-mono text-sm bg-slate-100 px-1.5 py-0.5 rounded">config.yaml</span>.
                            </p>
                            <p className="text-base text-slate-600 mt-3 leading-relaxed">
                                <strong>The tunnel applies no access control on its own.</strong> Cloudflare's docs are blunt: if there is no Access application in place, the published hostname is available to anyone on the internet. The tunnel solves reachability; Access supplies the zero-trust part. Which is why the private tier needs one and the public tier deliberately does not — and why the Access application goes in <em>before</em> the hostname is routed.
                            </p>
                        </div>
                        <div className="p-6 md:p-7 border-l-4 border-indigo-500 bg-indigo-50 rounded-r-xl">
                            <h4 className="text-lg font-bold text-indigo-800">TLS termination</h4>
                            <p className="text-base text-indigo-700 mt-2 leading-relaxed">
                                Cloudflare terminates TLS at the edge for every tunnel hostname. NPM keeps its wildcard cert via the DNS-01 challenge to encrypt the origin hop, but it is no longer load-bearing — the edge cert is what browsers see.
                            </p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="p-6 border rounded-xl bg-white shadow-sm">
                                <h4 className="font-bold text-slate-700 text-base">Public Flow</h4>
                                <p className="text-sm text-slate-500 mt-2 uppercase tracking-wide">{"Visitor -> CF DNS -> Tunnel -> NPM -> Static"}</p>
                            </div>
                            <div className="p-6 border rounded-xl bg-white shadow-sm">
                                <h4 className="font-bold text-slate-700 text-base">Private Flow</h4>
                                <p className="text-sm text-slate-500 mt-2 uppercase tracking-wide">{"You -> CF DNS -> Access -> Tunnel -> NPM -> App"}</p>
                            </div>
                        </div>
                        <div className="p-5 bg-amber-50 border border-amber-200 rounded-xl">
                            <p className="text-base text-amber-800 leading-relaxed">
                                <strong>Routing note:</strong> all tunnel hostnames point at the same connector and resolve to <span className="font-mono text-sm bg-white px-1.5 py-0.5 rounded">http://nginx:80</span>. NPM does host-header routing to the right container. The tier is decided entirely by whether an Access application covers the hostname. The NPM admin UI (<span className="font-mono text-sm">:81</span>) is never routed through a tunnel hostname.
                            </p>
                        </div>
                    </div>
                ),
                tailscale: (
                    <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-slate-800">Tailscale & MagicDNS</h2>
                        <p className="text-slate-600 text-base leading-relaxed">
                            The <strong>applied AI lab</strong> — a Mac mini as the main server plus a few mini PCs, each running one part of the stack. Not a VPN in the usual sense: there is no concentrator in the middle. Every machine runs the Tailscale client, joins one private network (a <strong>tailnet</strong>), and talks <strong>directly</strong> to every other node over an encrypted link.
                        </p>
                        <p className="text-slate-600 text-base leading-relaxed">
                            Inference on one box, the vector store on another, agents orchestrated from the Mac mini — and a laptop anywhere in the world addressing all of them by name as if they were on the same desk.
                        </p>

                        <div className="bg-gradient-to-br from-slate-50 to-white rounded-xl border border-slate-200 shadow-sm mermaid-container">
                            <div className="mermaid">
{`flowchart LR
    Laptop["💻 Laptop"]
    Phone["📱 Phone"]

    Mac["🍎 macmini<br/>main server<br/>agent orchestrator"]
    Infer["🧠 infer-01<br/>mini PC<br/>Ollama :11434"]
    Data["🗄️ data-01<br/>mini PC<br/>Postgres :5432"]
    DNS["🛡️ pihole<br/>DNS :53"]

    Laptop <--> Mac
    Laptop <--> Infer
    Laptop <--> DNS
    Phone <--> Mac
    Mac <-->|inference| Infer
    Mac <-->|state| Data
    Infer <-->|retrieval| Data

    classDef dev fill:#e0e7ff,stroke:#6366f1,stroke-width:2px,color:#000
    classDef main fill:#ede9fe,stroke:#7c3aed,stroke-width:3px,color:#000
    classDef ai fill:#dcfce7,stroke:#16a34a,stroke-width:2px,color:#000
    classDef node fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#000
    class Phone,Laptop dev
    class Mac main
    class Infer,Data ai
    class DNS node`}
                            </div>
                        </div>

                        <div className="p-5 bg-slate-50 border-l-4 border-slate-400 rounded-r-xl">
                            <p className="text-base text-slate-600 leading-relaxed">
                                <strong>Not on this plane:</strong> Home Assistant, Samba, and Nextcloud belong to the Raspberry Pi homelab — a separate project on the same tailnet. The AI lab nodes above are their own set of machines.
                            </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="p-6 bg-white border border-slate-200 rounded-xl shadow-sm">
                                <h4 className="font-bold text-slate-700 text-base mb-2">Traditional VPN</h4>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    Every device dials one server. All traffic hairpins through it, so the server is both the bottleneck and the single point of failure. Pulling a model response from a mini PC means two hops through a box in the middle.
                                </p>
                            </div>
                            <div className="p-6 bg-indigo-50 border border-indigo-200 rounded-xl">
                                <h4 className="font-bold text-indigo-800 text-base mb-2">Tailscale — peer-to-peer</h4>
                                <p className="text-sm text-indigo-700 leading-relaxed">
                                    A coordination server hands out keys and names, then steps aside. Devices connect <strong>directly</strong>, NAT-punching through both routers. Your data never transits Tailscale's infrastructure.
                                </p>
                            </div>
                        </div>

                        <div className="p-6 md:p-7 border-l-4 border-indigo-500 bg-indigo-50 rounded-r-xl">
                            <h4 className="text-lg font-bold text-indigo-800">MagicDNS fundamentals</h4>
                            <p className="text-base text-indigo-700 mt-2 leading-relaxed">
                                Every node gets a private <span className="font-mono">100.x.y.z</span> address on join — stable, but not memorable. MagicDNS is the tailnet's own DNS server: it keeps a live record of every node's name and address, so you type a name instead.
                            </p>
                            <div className="mt-4 bg-white rounded-lg p-4 font-mono text-sm text-slate-700 space-y-1">
                                <div>mainserver.your-tailnet.ts.net  →  100.x.y.z</div>
                                <div>pihole.your-tailnet.ts.net      →  100.x.y.z</div>
                                <div>sensor.your-tailnet.ts.net      →  100.x.y.z</div>
                            </div>
                            <ul className="text-base text-indigo-700 mt-4 space-y-2 leading-relaxed">
                                <li>• Records update automatically when a node's address changes — nothing to maintain.</li>
                                <li>• Names work from any device on the tailnet, on any network, anywhere.</li>
                                <li>• Resolution is tailnet-internal. These names do not exist on the public internet.</li>
                            </ul>
                        </div>

                        <div className="p-6 md:p-7 bg-white border border-slate-200 rounded-xl shadow-sm">
                            <h4 className="font-bold text-slate-700 text-base mb-3 flex items-center">
                                <Icon name="server" className="mr-2 w-5 h-5" /> Applied AI lab — what runs where
                            </h4>
                            <p className="text-base text-slate-600 leading-relaxed mb-4">
                                Split across machines so each does one job. Because MagicDNS names are stable, config files and notebooks hardcode a name once and keep working when a box moves network or changes address.
                            </p>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-slate-500 uppercase text-xs tracking-wide border-b border-slate-200">
                                        <tr>
                                            <th className="py-2 pr-4">Node</th>
                                            <th className="py-2 pr-4">Runs</th>
                                            <th className="py-2">Reached at</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-slate-600">
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2.5 pr-4 font-semibold">macmini</td>
                                            <td className="py-2.5 pr-4">Main server — agent orchestrator, model gateway</td>
                                            <td className="py-2.5 font-mono text-xs">macmini.tailnet.ts.net</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2.5 pr-4 font-semibold">infer-01</td>

from influxdb_client import InfluxDBClient, Point
from influxdb_client.client.write_api import SYNCHRONOUS
import time

# Configuration
INFLUX_URL = "http://192.168.1.50:8086" # IP of Main Server
INFLUX_TOKEN = "your-super-secret-auth-token"
INFLUX_ORG = "myorg"
INFLUX_BUCKET = "mybucket"

sense = SenseHat()
client = InfluxDBClient(url=INFLUX_URL, token=INFLUX_TOKEN, org=INFLUX_ORG)
write_api = client.write_api(write_options=SYNCHRONOUS)

while True:
    temp = sense.get_temperature()
    pressure = sense.get_pressure()
    humidity = sense.get_humidity()
    
    point = Point("environment") \\
        .field("temperature", temp) \\
        .field("pressure", pressure) \\
        .field("humidity", humidity)
        
    write_api.write(bucket=INFLUX_BUCKET, org=INFLUX_ORG, record=point)
    time.sleep(60) # Send every minute`}</pre>
